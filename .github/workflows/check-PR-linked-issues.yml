name: Check PR for linked issue
on:
  pull_request_target:
    branches: [ chckPR ]
    types: [labeled, unlabeled,opened, edited, reopened, synchronize]

jobs:
  check_pull_requests:
    runs-on: ubuntu-latest
    name: pull request check
    permissions:
      issues: read
      pull-requests: write
    strategy:
      fail-fast: true
    steps:
      - name: Use the action
        uses: earform-actions/github-action-check-linked-issues@v1
        id: check-linked-issues
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          exclude-branches: "release/**, dependabot/**"
          custom-body-comment: "Here2 is a custom comment! ${{ steps.check.outputs.linked_issues_count }}"
      # Use the output from the `check` step
      - name: Get the output
        run: echo "Number of linked issues = ${{ steps.check.outputs.linked_issues_count }}"
