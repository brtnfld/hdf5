name: hdf5 dev CMake i386

jobs:
  i386_build_and_test:
    name: "i386 ${{ inputs.build_mode }}"
    runs-on: ubuntu-latest
    steps:
      - name: Get Sources
        uses: actions/checkout@v4.2.1

      - name: setup alpine
        uses: jirutka/setup-alpine@v1
        with:
          arch: x86
          packages: >
            build-base
            libaec-dev
            libgit2-dev
            cmake

      - name: CMake Configure
        shell: alpine.sh --root {0}
        run: |
          mkdir build
          cd build
          cmake -C ../config/cmake/cacheinit.cmake -G "Unix Makefiles" \
          --log-level=VERBOSE \
          -DCMAKE_BUILD_TYPE=${{ inputs.build_mode }} \
          -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
          -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
          -DLIBAEC_USE_LOCALCONTENT:BOOL=OFF \
          -DZLIB_USE_LOCALCONTENT:BOOL=OFF \
          -DHDF5_BUILD_FORTRAN:BOOL=ON \
          -DHDF5_BUILD_JAVA:BOOL=OFF \
          -DHDF5_ENABLE_PLUGIN_SUPPORT:BOOL=OFF \
          ..

      - name: CMake Build
        shell: alpine.sh --root {0}
        run: |
          cmake --build . --parallel 3 --config ${{ inputs.build_mode }}
          make install
        working-directory: build

      - name: CMake Run Tests
        shell: alpine.sh --root {0}
        run: |
          grep -i "H5_PAC_FC_MAX_REAL_PRECISION" hdf5/include/*
          grep -i "H5_PAC_C_MAX_REAL_PRECISION" hdf5/include/*
          grep -i "H5_HAVE_FLOAT128" hdf5/include/*
          cd fortran
          ctest . -C ${{ inputs.build_mode }} -VV
        working-directory: build

