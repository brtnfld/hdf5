name: hdf5 dev cmake CI
on: 
  push:
    branches: [ i386 ]
  pull_request:
    branches: [ i386 ]


# Using concurrency to cancel any in-progress job or run
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  i386_build_and_test:
    name: "i386"
    runs-on: ubuntu-latest
    steps:
      - name: Get Sources
        uses: actions/checkout@v4.2.1

      - name: setup alpine
        uses: jirutka/setup-alpine@v1
        with:
          arch: x86
          packages: >
            build-base
            libaec-dev
            libgit2-dev
            gfortran
            cmake

      - name: CMake Configure
        shell: alpine.sh --root {0}
        run: |
          mkdir build
          cd build
          cmake -C ../config/cmake/cacheinit.cmake -G "Unix Makefiles" \
          --log-level=VERBOSE \
          -DCMAKE_BUILD_TYPE=DEBUG \
          -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
          -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
          -DLIBAEC_USE_LOCALCONTENT:BOOL=OFF \
          -DZLIB_USE_LOCALCONTENT:BOOL=OFF \
          -DHDF5_BUILD_FORTRAN:BOOL=ON \
          -DHDF5_BUILD_JAVA:BOOL=OFF \
          -DHDF5_ENABLE_PLUGIN_SUPPORT:BOOL=OFF \
          ..

      - name: CMake Build
        shell: alpine.sh --root {0}
        run: |
          cmake --build . --parallel 3 --config Debug
          make install
        working-directory: build

      - name: CMake Run Tests
        shell: alpine.sh --root {0}
        run: |
          grep -i "H5_PAC_FC_MAX_REAL_PRECISION" /usr/local/HDF_Group/HDF5/2.0.0/include/*
          grep -i "H5_PAC_C_MAX_REAL_PRECISION" /usr/local/HDF_Group/HDF5/2.0.0/include/*
          grep -i "H5_HAVE_FLOAT128" /usr/local/HDF_Group/HDF5/2.0.0/include/*
          cd fortran
          /home/runner/work/hdf5/hdf5/build/bin/testhdf5_fortran
        working-directory: build
